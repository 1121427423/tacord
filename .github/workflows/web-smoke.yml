name: web-smoke

# 在**真浏览器**里看一眼部署出去的东西。
#
# 为什么单独开一个 workflow：Godot 的 headless 模式不渲染，所以"场景脚本报错"
# "相机朝向错了""wasm 扩展没加载"在 sim.yml 里**全都看不见** —— 它们只表现为
# 用户那边的"加载完了但是一片黑"。这里用 Chrome（软件 WebGL2 / SwiftShader）
# 打开**已经部署的那份产物**（ci/web-preview = Pages 上正在跑的内容），
# 抓控制台 + 截图，产物上传后人工（或 agent）看图。
#
# 触发：手动 —— gh workflow run web-smoke.yml
# 不重新导出（导出要 20 分钟）：要看新构建就先推一个带 [web] 的提交。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: 真浏览器看一眼（Chrome + SwiftShader）
    runs-on: ubuntu-latest
    steps:
      - name: 取工具与脚本
        uses: actions/checkout@v4

      # 已部署的那份产物（orphan 分支，只有 dist 的内容）
      - name: 取 Pages 上正在跑的那份 dist
        uses: actions/checkout@v4
        with:
          ref: ci/web-preview
          path: dist
          clean: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 起静态服务
        run: |
          set -e
          ls -la dist
          python3 -m http.server 8080 --bind 127.0.0.1 --directory dist > /tmp/http.log 2>&1 &
          sleep 2
          curl -sS -o /dev/null -w "index.html -> %{http_code}\n" http://127.0.0.1:8080/index.html

      - name: 装 puppeteer（自带 Chrome）
        run: npm init -y >/dev/null 2>&1; npm i puppeteer --no-audit --no-fund 2>&1 | tail -3

      - name: 跑浏览器冒烟
        run: node tools/web_smoke.mjs
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: web-smoke
          path: |
            /tmp/web-shot.png
            /tmp/web-console.log
          if-no-files-found: warn
