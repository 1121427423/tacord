name: sim

# 模拟核心的持续集成。
# 沙箱开发机没有 Rust 工具链，所以这里同时充当"编译器"：
# 推送后由 GitHub Actions 真正编译并跑单测，结果用 `gh run view` 查看。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      long_bench:
        description: "跑长基线（G1 取数），否则只跑冒烟"
        type: boolean
        default: false
      ticks:
        description: "长基线的 tick 数"
        type: string
        default: "100000"

permissions:
  contents: write

jobs:
  test:
    name: cargo test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sim

      - name: Build
        working-directory: sim
        run: cargo build --release --verbose

      - name: Test
        working-directory: sim
        run: cargo test --release -- --nocapture

      - name: 冒烟：世界自检 + 性能基线（结果仅记录，不作性能门禁）
        working-directory: sim
        run: |
          cargo run --release -q -p sim_cli -- worldcheck --world 64 2>&1 | tee /tmp/ci-bench.log
          cargo run --release -q -p sim_cli -- bench --units 400 --ticks 20000 --rays 4 --world 256 --seed 1 2>&1 | tee -a /tmp/ci-bench.log

      - name: 把日志推到 ci/artifacts 分支（沙箱读不到 Actions 日志）
        if: always()
        working-directory: sim
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          if [ "${{ job.status }}" != "success" ]; then
            {
              echo "commit: ${GITHUB_SHA}"
              echo "branch: ${GITHUB_REF_NAME}"
              echo "date: $(date -u)"
              echo "job status: ${{ job.status }}"
              echo
              echo "=== cargo build (short) ==="
              cargo build --release --message-format short 2>&1
              echo
              echo "=== cargo test (nocapture) ==="
              cargo test --release -- --nocapture 2>&1
            } > /tmp/ci-last-failure.log 2>&1
          else
            rm -f /tmp/ci-last-failure.log
          fi
          cd "${GITHUB_WORKSPACE}"
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci/artifacts
          mkdir -p ci
          [ -f /tmp/ci-last-failure.log ] && cp /tmp/ci-last-failure.log ci/last-failure.log
          [ -f /tmp/ci-bench.log ] && cp /tmp/ci-bench.log ci/perf-latest.log
          git add -f ci
          git commit -m "ci: logs for ${GITHUB_SHA:0:8} (${{ job.status }})" || echo "no changes"
          git push -f origin ci/artifacts

      # 调试构建下的溢出检查：定点运算最容易在这里翻车
      - name: Test (debug, overflow checks on)
        working-directory: sim
        run: cargo test --verbose

  lint:
    name: 格式与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt（暂不阻塞，待首次修复后改为强制）
        working-directory: sim
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: clippy（暂不阻塞）
        working-directory: sim
        continue-on-error: true
        run: cargo clippy --all-targets

  constants:
    name: 参数与查找表一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 常量自检（派生量 / 分频 / 预算 / 文档对照）
        run: python3 tools/check_constants.py --verbose
      - name: 查找表必须与生成器一致（防止手改生成物破坏跨平台确定性）
        run: python3 tools/gen_trig.py --check

  bench:
    name: 性能基线（G1 取数，手动触发或提交信息含 [bench]）
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.long_bench) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[bench]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sim
      - name: 长基线
        working-directory: sim
        run: |
          set +e
          {
            echo "commit: ${GITHUB_SHA}"
            echo "runner: $(uname -m) / $(grep -m1 'model name' /proc/cpuinfo | sed 's/.*: //')"
            echo "date: $(date -u)"
            echo
            echo "=== 参数（冻结参数表 §15）==="
            echo "units 400 / ticks ${{ inputs.ticks || '100000' }} / rays-per-unit-per-tick 4 / world 128m"
            echo
            echo "=== A：400 单位 · 4 射线/单位/tick · 128m 世界 ==="
            cargo run --release -q -p sim_cli -- bench --units 400 --ticks ${{ inputs.ticks || '100000' }} --rays 4 --world 256 --seed 1
            echo
            echo "=== B：400 单位 · 8 射线/单位/tick（更接近掩体评分的实际射线数）==="
            cargo run --release -q -p sim_cli -- bench --units 400 --ticks $(( ${{ inputs.ticks || '100000' }} / 4 )) --rays 8 --world 256 --seed 1
            echo
            echo "=== C：1 单位 · 128m 长射线（单条成本上限）==="
            cargo run --release -q -p sim_cli -- bench --units 1 --ticks 200000 --rays 4 --world 256 --seed 1
          } > /tmp/ci-baseline.log 2>&1
          cat /tmp/ci-baseline.log
      - name: 把基线推到 ci/artifacts
        if: always()
        working-directory: sim
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          cd "${GITHUB_WORKSPACE}"
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci/artifacts
          mkdir -p ci/perf
          [ -f /tmp/ci-baseline.log ] && cp /tmp/ci-baseline.log ci/perf/baseline-${GITHUB_SHA:0:8}.log
          cp /tmp/ci-baseline.log ci/perf/latest-baseline.log
          git add -f ci
          git commit -m "ci: perf baseline for ${GITHUB_SHA:0:8}" || echo "no changes"
          git push -f origin ci/artifacts
