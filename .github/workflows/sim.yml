name: sim

# 模拟核心的持续集成。
#
# 沙箱开发机没有 Rust 工具链，所以这里同时充当"编译器"：推送后由 GitHub Actions
# 真正编译并跑单测，结果用 `gh run list` / `gh api …/jobs` 查看。
#
# **日志怎么拿回来**：沙箱访问不到 `results-receiver.actions.githubusercontent.com`
# （`gh run view --log` 与 `gh api …/logs` 都拿不到内容）。所以每个 job 都把输出
# 用 contents API 原子提交到 `ci/artifacts` 分支（逐文件、带 sha 更新、无并发覆盖）：
#   git fetch origin ci/artifacts && git show origin/ci/artifacts:ci/perf/latest-baseline.log

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      long_bench:
        description: "跑长基线（G1 取数），否则只跑冒烟"
        type: boolean
        default: false
      ticks:
        description: "长基线的 tick 数"
        type: string
        default: "100000"

permissions:
  contents: write

jobs:
  # ─────────────────────────── 编译 + 单测 + 冒烟 ───────────────────────────
  test:
    name: cargo test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sim

      - name: Build
        working-directory: sim
        run: cargo build --release --verbose

      - name: Test
        working-directory: sim
        run: cargo test --release -- --nocapture

      # 调试构建下的溢出检查：定点运算最容易在这里翻车
      - name: Test (debug, overflow checks on)
        working-directory: sim
        run: cargo test --verbose

      - name: 冒烟：世界自检 + 性能基线（结果仅记录，不作性能门禁）
        working-directory: sim
        run: |
          cargo run --release -q -p sim_cli -- worldcheck --world 64 2>&1 | tee /tmp/ci-smoke.log
          cargo run --release -q -p sim_cli -- bench --units 400 --ticks 20000 --rays 4 --world 256 --seed 1 2>&1 | tee -a /tmp/ci-smoke.log
          cargo run --release -q -p sim_cli -- nav --units 400 --ticks 2000 --world 256 --breach 500 --seed 1 2>&1 | tee -a /tmp/ci-smoke.log
          cargo run --release -q -p sim_cli -- cover --world 256 --trials 100 --seed 1 2>&1 | tee -a /tmp/ci-smoke.log
          # 反脚本化验收（§20.1.8）：随机遭遇里 3 秒内 blocking ≥ 0.7 的成功率必须 ≥ 95%
          # §20.1.8 三条验收一起过：找掩体 ≥95% / 被包抄换槽 ≥90% / 打掉就失效 =100%
          gate() {  # $1 = 机器可读行的名字，$2 = 门槛
            local v
            v=$(grep -o "$1=[0-9.]*" /tmp/ci-smoke.log | tail -1 | cut -d= -f2)
            echo "$1 = ${v}% （门槛 $2%）"
            awk -v p="${v:-0}" -v t="$2" 'BEGIN{exit !(p+0 >= t+0)}' || {
              echo "::error::$1 未达标：${v}% < $2%（见 latest-smoke.log）"
              exit 1
            }
          }
          gate cover_rate_pct 95
          gate flank_rate_pct 90
          gate destroy_rate_pct 100

      - name: 记录输出（失败时另存编译/测试日志）
        if: always()
        working-directory: sim
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          put_file() {  # $1 = 仓库内路径，$2 = 本地文件
            content=$(base64 < "$2" | tr -d '\n')
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/$1?ref=ci/artifacts" --jq .sha 2>/dev/null)
            if [ -n "$sha" ]; then
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$1" \
                -f message="ci: $1 (${GITHUB_SHA:0:8})" -f content="$content" \
                -f branch=ci/artifacts -f sha="$sha" > /dev/null
            else
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$1" \
                -f message="ci: $1 (${GITHUB_SHA:0:8})" -f content="$content" \
                -f branch=ci/artifacts > /dev/null
            fi
          }
          if [ "${{ job.status }}" != "success" ]; then
            {
              echo "commit: ${GITHUB_SHA}"
              echo "branch: ${GITHUB_REF_NAME}"
              echo "date: $(date -u)"
              echo "job status: ${{ job.status }}"
              echo
              echo "=== cargo build (short) ==="
              cargo build --release --message-format short 2>&1
              echo
              echo "=== cargo test (nocapture) ==="
              cargo test --release -- --nocapture 2>&1
            } > /tmp/ci-failure.log 2>&1
            put_file ci/last-failure.log /tmp/ci-failure.log
          fi
          [ -f /tmp/ci-smoke.log ] && put_file ci/perf/latest-smoke.log /tmp/ci-smoke.log
          exit 0

  # ─────────────────────────── 长基线（G1 取数）───────────────────────────
  bench:
    name: 性能基线（G1 取数，[bench] 或手动触发）
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.long_bench) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[bench]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sim
      - name: 五组负载
        working-directory: sim
        run: |
          set +e
          TICKS="${{ inputs.ticks || '100000' }}"
          {
            echo "commit: ${GITHUB_SHA}"
            echo "runner: $(uname -m) / $(grep -m1 'model name' /proc/cpuinfo | sed 's/.*: //')"
            echo "date: $(date -u)"
            echo "ticks: ${TICKS}"
            echo
            echo "=== A 最坏情况：400 单位 · 4 射线/tick · 128m 世界 · 不限长 ==="
            cargo run --release -q -p sim_cli -- bench --units 400 --ticks ${TICKS} --rays 4 --world 256 --seed 1
            echo
            echo "=== B 掩体评分（真实分布）：4 射线/tick · 截断到 30m ==="
            cargo run --release -q -p sim_cli -- bench --units 400 --ticks ${TICKS} --rays 4 --world 256 --maxdist 30000 --seed 1
            echo
            echo "=== C 感知 LOS（真实分布）：1 射线/tick · 截断到 80m ==="
            cargo run --release -q -p sim_cli -- bench --units 400 --ticks ${TICKS} --rays 1 --world 256 --maxdist 80000 --seed 1
            echo
            echo "=== D 压力：8 射线/tick · 不限长 ==="
            cargo run --release -q -p sim_cli -- bench --units 400 --ticks $(( ${TICKS} / 4 )) --rays 8 --world 256 --seed 1
            echo
            echo "=== E 单条成本：1 单位 · 不限长 ==="
            cargo run --release -q -p sim_cli -- bench --units 1 --ticks 200000 --rays 4 --world 256 --seed 1
          } > /tmp/ci-baseline.log 2>&1
          cat /tmp/ci-baseline.log
      - name: 记录基线
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          content=$(base64 < /tmp/ci-baseline.log | tr -d '\n')
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/ci/perf/latest-baseline.log?ref=ci/artifacts" --jq .sha 2>/dev/null)
          if [ -n "$sha" ]; then
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/ci/perf/latest-baseline.log" \
              -f message="ci: baseline ${GITHUB_SHA:0:8}" -f content="$content" \
              -f branch=ci/artifacts -f sha="$sha" > /dev/null
          else
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/ci/perf/latest-baseline.log" \
              -f message="ci: baseline ${GITHUB_SHA:0:8}" -f content="$content" \
              -f branch=ci/artifacts > /dev/null
          fi
          exit 0

  # ────────────────── 三平台确定性（A1 / A7 的必要条件）──────────────────
  determinism:
    name: 三平台确定性（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sim

      - name: Test (release)
        shell: bash
        working-directory: sim
        run: cargo test --release

      - name: 确定性负载（世界校验和 + bench）
        shell: bash
        working-directory: sim
        run: |
          set +e
          OS="${{ matrix.os }}"
          cargo run --release -q -p sim_cli -- worldcheck --world 64 > "worldcheck-${OS}.txt" 2>&1
          cargo run --release -q -p sim_cli -- bench --units 400 --ticks 20000 --rays 4 --world 256 --seed 1 > "bench-${OS}.txt" 2>&1
          cargo run --release -q -p sim_cli -- cover --world 256 --trials 100 --seed 1 > "cover-${OS}.txt" 2>&1
          {
            echo "os: ${OS}"
            echo "arch: $(uname -m)"
            echo "cpu: $( [ -f /proc/cpuinfo ] && grep -m1 'model name' /proc/cpuinfo | sed 's/.*: //' || sysctl -n machdep.cpu.brand_string 2>/dev/null || echo unknown )"
            echo "commit: ${GITHUB_SHA}"
            echo "date: $(date -u)"
          } > "meta-${OS}.txt"
          echo "--- worldcheck ---"; cat "worldcheck-${OS}.txt"
          echo "--- bench ---";      cat "bench-${OS}.txt"
          echo "--- cover ---";      cat "cover-${OS}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: sim-${{ matrix.os }}
          path: sim/*-${{ matrix.os }}.txt
          if-no-files-found: error

  # A7 要求的"artifact 比对 job"：下载三平台产物，逐字节比对校验和
  determinism-compare:
    name: 三平台校验和比对（A1 / A7）
    needs: determinism
    if: always() && needs.determinism.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 列出产物
        run: ls -R artifacts
      - name: 逐平台校验和必须逐位一致
        run: |
          set -e
          fail=0
          for kind in worldcheck bench cover; do
            echo "=== ${kind} ==="
            base=""
            for f in artifacts/sim-*/${kind}-*.txt; do
              [ -f "$f" ] || continue
              os=$(basename "$f" .txt | sed "s/^${kind}-//")
              sum=$(grep -o '0x[0-9A-F]\{16\}' "$f" | tail -1)
              if [ -z "$sum" ]; then echo "  ${os}: 没找到校验和，视为失败"; fail=1; continue; fi
              echo "  ${os}: ${sum}"
              if [ -z "$base" ]; then base="$sum"; elif [ "$sum" != "$base" ]; then
                echo "  ❌ ${os} 与基线不一致（${sum} != ${base}）"; fail=1
              fi
            done
          done
          if [ "$fail" != "0" ]; then echo "::error::三平台校验和不一致"; exit 1; fi
          echo "✅ 三平台逐位一致"
      - name: 记录各平台输出
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          put_file() {
            content=$(base64 < "$2" | tr -d '\n')
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/$1?ref=ci/artifacts" --jq .sha 2>/dev/null)
            if [ -n "$sha" ]; then
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$1" \
                -f message="ci: $1 (${GITHUB_SHA:0:8})" -f content="$content" \
                -f branch=ci/artifacts -f sha="$sha" > /dev/null
            else
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$1" \
                -f message="ci: $1 (${GITHUB_SHA:0:8})" -f content="$content" \
                -f branch=ci/artifacts > /dev/null
            fi
          }
          for f in artifacts/sim-*/*.txt; do
            [ -f "$f" ] && put_file "ci/perf/$(basename "$f")" "$f"
          done
          exit 0

  # ─────────────────── Godot 薄绑定（A5：macOS arm64 也要能构建）──────────────────
  godot:
    name: Godot 薄绑定（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gdext

      - name: 下载 Godot 4.7.2（headless）

        shell: bash
        run: |
          set -e
          VER=4.7.2
          case "${{ matrix.os }}" in
            ubuntu-latest)
              ZIP="Godot_v${VER}-stable_linux.x86_64.zip"
              OUT="/tmp/godot/Godot_v${VER}-stable_linux.x86_64" ;;
            macos-15)
              ZIP="Godot_v${VER}-stable_macos.universal.zip"
              OUT="/tmp/godot/Godot.app/Contents/MacOS/Godot" ;;
          esac
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${VER}-stable/${ZIP}"
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "$OUT"
          echo "GODOT_BIN=$OUT" >> "$GITHUB_ENV"

      # api-custom：用**真实**的 Godot 4.7.2 生成 API 绑定，而不是 gdext 预置的 4.6
      # （否则运行时会打印 "API v4.6 / runtime v4.7.2"，靠兼容层兜着 —— 能跑，但不该依赖它）
      - name: 构建 GDExtension
        working-directory: gdext
        run: |
          set +e
          export GODOT4_BIN="$GODOT_BIN"
          {
            cargo build --release --features api-custom
            echo "--- 产物 ---"
            find target/release -maxdepth 1 -name "libtacord_gdext*" -o -maxdepth 1 -name "*.so" -o -maxdepth 1 -name "*.dylib" | head
            # 库必须落到 res:// 内部（godot/bin/），否则导出时不会被打包进产物
            mkdir -p ../godot/bin
            cp -v target/release/libtacord_gdext.so    ../godot/bin/
            cp -v target/release/libtacord_gdext.dylib ../godot/bin/
            echo "--- godot/bin ---"
            ls -la ../godot/bin
          } 2>&1 | tee /tmp/godot-build.log

      - name: 导入工程
        shell: bash
        run: |
          set +e
          bash tools/ci_timeout.sh 300 "$GODOT_BIN" --headless --path godot --editor --quit 2>&1 | tee /tmp/godot-import.log
          echo "import 退出码: $?"

      - name: 冒烟：扩展能加载 + 能 tick + 校验和
        shell: bash
        run: |
          set +e
          # 所有诊断都要写进 /tmp/godot-smoke.log —— Actions 的 stdout 在沙箱里读不到
          code=0
          {
            date -u
            echo "run_id=$GITHUB_RUN_ID runner=$RUNNER_OS $RUNNER_ARCH"
            uname -m
            pwd
            echo "--- godot/bin ---"
            ls -la godot/bin
            echo "--- tacord.gdextension ---"
            cat godot/tacord.gdextension
            echo "--- Godot 认为的 feature ---"
            bash tools/ci_timeout.sh 120 "$GODOT_BIN" --headless --path godot --script res://scripts/features.gd
            echo "--- smoke ---"
            bash tools/ci_timeout.sh 180 "$GODOT_BIN" --headless --path godot --script res://scripts/smoke.gd
            code=$?
            echo "smoke 退出码: $code"
            echo "$code" > /tmp/smoke-code
          } 2>&1 | tee /tmp/godot-smoke.log
          exit "$(cat /tmp/smoke-code)"

      # 主场景冒烟：Web 版没有控制台，"场景加载失败"在浏览器里就是一片黑且无提示。
      # headless 不渲染，挡不住"没光源/相机朝向错"，但能挡住脚本错误和类找不到。
      - name: 冒烟：主场景能加载并连续跑 30 帧
        shell: bash
        run: |
          set +e
          code=0
          {
            bash tools/ci_timeout.sh 180 "$GODOT_BIN" --headless --path godot --script res://scripts/scene_smoke.gd
            code=$?
            echo "scene 退出码: $code"
            echo "$code" > /tmp/scene-code
          } 2>&1 | tee /tmp/godot-scene.log
          # headless 用 --script 跑到 quit() 时，Godot 自己会报"运行时建的节点
          # 来不及 free"（ObjectDB instance / RID allocations leaked）—— 那是
          # teardown 噪声，不是场景错误；除此之外的 ERROR 一律不放过。
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" /tmp/godot-scene.log \
              | grep -vE "ObjectDB instance was leaked|RID allocations .* were leaked at exit" \
              | grep -q .; then
            echo "::error::主场景有错误（见 godot-scene.log）"
            grep -E "SCRIPT ERROR|Parse Error|ERROR:" /tmp/godot-scene.log | head -20
            exit 1
          fi
          if ! grep -q "\[scene\] DONE frames=" /tmp/godot-scene.log; then
            echo "::error::主场景没跑起来（没跑到 DONE）"
            exit 1
          fi
          if ! grep -q "units=400" /tmp/godot-scene.log; then
            echo "::error::主场景里 sim 没接到（units 不是 400）"
            exit 1
          fi
          # M1-A：画面里必须真的有城、有掩体（wall_boxes / cover 派生为空 ⇒ 一片空地）
          if ! grep -qE "walls=[1-9][0-9]*" /tmp/godot-scene.log; then
            echo "::error::场景里一面墙都没有（wall_boxes 是空的？）"
            exit 1
          fi
          if ! grep -qE "slots=[1-9][0-9]*" /tmp/godot-scene.log; then
            echo "::error::场景里一个掩体槽都没有（掩体场没建起来？）"
            exit 1
          fi
          exit "$(cat /tmp/scene-code)"

      - name: 记录输出
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          put_file() {
            [ -f "$2" ] || return 0
            content=$(base64 < "$2" | tr -d '\n')
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/$1?ref=ci/artifacts" --jq .sha 2>/dev/null)
            if [ -n "$sha" ]; then
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$1" \
                -f message="ci: $1 (${GITHUB_SHA:0:8})" -f content="$content" \
                -f branch=ci/artifacts -f sha="$sha" > /dev/null
            else
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$1" \
                -f message="ci: $1 (${GITHUB_SHA:0:8})" -f content="$content" \
                -f branch=ci/artifacts > /dev/null
            fi
          }
          put_file "ci/perf/godot-smoke-${{ matrix.os }}.log" /tmp/godot-smoke.log
          put_file "ci/perf/godot-scene-${{ matrix.os }}.log" /tmp/godot-scene.log
          put_file "ci/perf/godot-import-${{ matrix.os }}.log" /tmp/godot-import.log
          put_file "ci/perf/godot-build-${{ matrix.os }}.log" /tmp/godot-build.log
          exit 0

  # ─────────────────────────── Web 导出（wasm 侧模块）───────────────────────────
  # 单线程（nothreads）路线：sim 本来就是单线程，且产物不要求服务端配 COOP/COEP 头。
  # 触发：提交信息含 [web]、推送到 main、或手动 dispatch（emsdk + build-std 很慢）。
  web:
    name: Web 导出（wasm）
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[web]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # wasm 需要 nightly：-Zbuild-std 是 nightly 特性（std 要为 wasm 重新编译）
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: wasm32-unknown-emscripten
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gdext

      - name: Install emsdk 3.1.74
        run: |
          set -e
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          cd /tmp/emsdk
          ./emsdk install 3.1.74
          ./emsdk activate 3.1.74
          echo "/tmp/emsdk" >> "$GITHUB_PATH"
          echo "/tmp/emsdk/upstream/emscripten" >> "$GITHUB_PATH"

      - name: Download Godot 4.7.2 + 导出模板
        run: |
          set -e
          VER=4.7.2
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${VER}-stable/Godot_v${VER}-stable_linux.x86_64.zip"
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="/tmp/godot/Godot_v${VER}-stable_linux.x86_64"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          # 导出模板：Godot 要求放在 export_templates/<version>/ 下
          curl -sSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${VER}-stable/Godot_v${VER}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates "$HOME/.local/share/godot/export_templates/${VER}.stable"
          ls "$HOME/.local/share/godot/export_templates/${VER}.stable"

      - name: emcc 版本
        run: emcc --version | head -2

      - name: 构建 wasm 扩展（侧模块 · 单线程）
        working-directory: gdext
        run: |
          set -e
          export GODOT4_BIN="$GODOT_BIN"
          {
            cargo +nightly build -Zbuild-std --target wasm32-unknown-emscripten --release \
              --features web-nothreads
            echo "--- wasm 产物 ---"
            find target/wasm32-unknown-emscripten/release -maxdepth 1 -name "*.wasm" | head
            mkdir -p ../godot/bin
            cp -v target/wasm32-unknown-emscripten/release/tacord_gdext.wasm ../godot/bin/
            ls -la ../godot/bin
          } 2>&1 | tee /tmp/web-build.log

      - name: 导出 Web
        run: |
          set +e
          mkdir -p godot/dist
          bash tools/ci_timeout.sh 900 "$GODOT_BIN" --headless --path godot --export-release "Web" 2>&1 | tee /tmp/web-export.log
          echo "--- 产物 ---"
          ls -la godot/dist
          # Godot 导出失败时**退出码仍然是 0**，只能靠"产物是否齐全 + 日志里有没有 failed"来判定
          if grep -q "Project export for preset .* failed" /tmp/web-export.log; then
            echo "::error::Godot 导出失败（见日志）"
            exit 1
          fi
          for f in index.html index.wasm index.pck tacord_gdext.wasm; do
            if [ ! -f "godot/dist/$f" ]; then
              echo "::error::缺少产物 $f"
              exit 1
            fi
          done
          echo "✅ 导出产物齐全"

      # 直接交给 GitHub Pages（仓库的 Pages 已经配成 build_type=workflow）
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: godot/dist

      - name: 产物推到 ci/web-preview 分支（沙箱取回用）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          cd "${GITHUB_WORKSPACE}"
          [ -d godot/dist ] && cp -r godot/dist/. /tmp/webdist/ || mkdir -p /tmp/webdist
          echo "=== 产物清单 ==="
          ls -la /tmp/webdist
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan ci/web-preview
          git rm -rf --cached . -q || true
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} + || true
          cp -r /tmp/webdist/. .
          git add -A
          git commit -m "web build ${GITHUB_SHA:0:8}" || echo "no changes"
          git push -f origin ci/web-preview
          # 日志存回 ci/artifacts，便于排查（沙箱读不到 Actions 日志）
          cd "${GITHUB_WORKSPACE}"
          git checkout -f "${GITHUB_SHA}" 2>/dev/null || true
          put_file() {
            [ -f "$2" ] || return 0
            content=$(base64 < "$2" | tr -d '\n')
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/$1?ref=ci/artifacts" --jq .sha 2>/dev/null)
            if [ -n "$sha" ]; then
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$1" \
                -f message="ci: $1 (${GITHUB_SHA:0:8})" -f content="$content" \
                -f branch=ci/artifacts -f sha="$sha" > /dev/null
            else
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$1" \
                -f message="ci: $1 (${GITHUB_SHA:0:8})" -f content="$content" \
                -f branch=ci/artifacts > /dev/null
            fi
          }
          put_file ci/perf/web-build.log /tmp/web-build.log
          put_file ci/perf/web-export.log /tmp/web-export.log
          exit 0

  # ─────────────────────────── 部署到 GitHub Pages ───────────────────────────
  # 地址：https://1121427423.github.io/tacord/
  # 用的是 artifact 部署路线（build_type=workflow），不需要 gh-pages 分支
  deploy-pages:
    name: 部署到 GitHub Pages
    needs: web
    if: needs.web.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4

  # ─────────────────── 真浏览器看一眼（headless 看不见黑屏）───────────────────
  # 触发：提交信息带 [browsersmoke]。
  #
  # 为什么需要：Godot 的 headless 模式**不渲染**，"脚本报错""相机朝向错"
  # "wasm 扩展没加载"在 CI 里全都看不见 —— 它们只表现为用户那边的"加载完了
  # 但是一片黑"。所以这里用真 Chrome（软件 WebGL2 / SwiftShader）打开
  # **已经在 Pages 上跑着的那份产物**（ci/web-preview 分支），抓控制台 + 截图。
  # 产物上传后本地 `gh run download` 就能看图。
  web-smoke:
    name: 真浏览器看一眼（Chrome + SwiftShader）
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[browsersmoke]')
    runs-on: ubuntu-latest
    steps:
      - name: 取工具与脚本
        uses: actions/checkout@v4

      - name: 取 Pages 上正在跑的那份 dist
        uses: actions/checkout@v4
        with:
          ref: ci/web-preview
          path: dist
          clean: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 起静态服务
        run: |
          set -e
          ls -la dist
          python3 -m http.server 8080 --bind 127.0.0.1 --directory dist > /tmp/http.log 2>&1 &
          sleep 2
          curl -sS -o /dev/null -w "index.html -> %{http_code}\n" http://127.0.0.1:8080/index.html

      - name: 装 puppeteer（自带 Chrome）
        run: npm init -y >/dev/null 2>&1; npm i puppeteer --no-audit --no-fund 2>&1 | tail -3

      - name: 跑浏览器冒烟
        run: node tools/web_smoke.mjs
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: web-smoke
          path: |
            /tmp/web-shot.png
            /tmp/web-console.log
          if-no-files-found: warn

      # 沙箱访问不到 Actions 的 artifact 存储（blob.core.windows.net 不通），
      # 所以**截图也要**走 contents API 存回 ci/artifacts —— 否则只能靠人去
      # GitHub 网页上点开看，等于没有闭环。
      - name: 记录截图与控制台
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          dbg=/tmp/web-upload.log
          {
            echo "=== /tmp ==="
            ls -la /tmp | head -20
            echo "=== gh 探测 ==="
            gh --version | head -1
            gh api "repos/${GITHUB_REPOSITORY}" --jq .full_name 2>&1 | head -3
            echo "=== GH_TOKEN 有没有设 ==="
            if [ -n "$GH_TOKEN" ]; then echo "已设"; else echo "没设！"; fi
          } > "$dbg" 2>&1
          put_file() {  # $1 = 仓库内路径，$2 = 本地文件
            if [ ! -f "$2" ]; then echo "跳过 $1：$2 不存在" >> "$dbg"; return 0; fi
            content=$(base64 -w0 < "$2")
            echo "存 $1（$(stat -c%s "$2") 字节，base64 ${#content}）" >> "$dbg"
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/$1?ref=ci/artifacts" --jq .sha 2>>"$dbg")
            if [ -n "$sha" ]; then
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$1" \
                -f message="ci: $1 (${GITHUB_SHA:0:8})" -f content="$content" \
                -f branch=ci/artifacts -f sha="$sha" 2>>"$dbg" | head -c 300 >> "$dbg"
            else
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$1" \
                -f message="ci: $1 (${GITHUB_SHA:0:8})" -f content="$content" \
                -f branch=ci/artifacts 2>>"$dbg" | head -c 300 >> "$dbg"
            fi
            echo "" >> "$dbg"
          }
          put_file ci/perf/web-shot.png /tmp/web-shot.png
          put_file ci/perf/web-console.log /tmp/web-console.log
          put_file ci/perf/web-upload.log "$dbg"
          exit 0

  # ─────────────────────────── 静态检查与参数 ───────────────────────────
  lint:
    name: 格式与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt（暂不阻塞，待首次修复后改为强制）
        working-directory: sim
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: clippy（暂不阻塞）
        working-directory: sim
        continue-on-error: true
        run: cargo clippy --all-targets

      # Godot 的 ConfigFile（.gdextension / export_presets.cfg / project.godot）用 VariantParser 解析：
      # 只有 ";" 是注释，"#" 不是；而且换行不清空正在累积的 key，
      # 于是 "# 中文注释" 会被整段拼进下一个 key —— 表现为"配置明明写了却不生效"，极难排查。
      - name: Godot 配置里不许有 "#" 注释
        run: |
          if grep -rnE "^[[:space:]]*#" godot/tacord.gdextension godot/export_presets.cfg godot/project.godot; then
            echo "::error::Godot 的 ConfigFile 不支持 # 注释（会被拼进下一个 key），改用 ; 或直接删掉"
            exit 1
          fi
          echo "✅ .gdextension / export_presets.cfg / project.godot 里没有 # 注释"

  constants:
    name: 参数与查找表一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 常量自检（派生量 / 分频 / 预算 / 导航 / 文档对照）
        run: python3 tools/check_constants.py --verbose
      - name: 查找表必须与生成器一致（防止手改生成物破坏跨平台确定性）
        run: python3 tools/gen_trig.py --check
      - name: sim 不得依赖 Godot（A6 边界强制）
        run: |
          if grep -rn "godot" --include="*.rs" --include="*.toml" sim/ ; then
            echo "::error::sim/ 里出现了 godot 依赖（边界被打破）"
            exit 1
          fi
          echo "✓ sim/ 与 Godot 无耦合"
