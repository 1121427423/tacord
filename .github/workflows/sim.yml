name: sim

# 模拟核心的持续集成。
#
# 沙箱开发机没有 Rust 工具链，所以这里同时充当"编译器"：推送后由 GitHub Actions
# 真正编译并跑单测，结果用 `gh run list` / `gh api …/jobs` 查看。
#
# **日志怎么拿回来**：沙箱访问不到 `results-receiver.actions.githubusercontent.com`
# （`gh run view --log` 与 `gh api …/logs` 都拿不到内容）。所以每个 job 都把输出
# 用 contents API 原子提交到 `ci/artifacts` 分支（逐文件、带 sha 更新、无并发覆盖）：
#   git fetch origin ci/artifacts && git show origin/ci/artifacts:ci/perf/latest-baseline.log

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      long_bench:
        description: "跑长基线（G1 取数），否则只跑冒烟"
        type: boolean
        default: false
      ticks:
        description: "长基线的 tick 数"
        type: string
        default: "100000"

permissions:
  contents: write

jobs:
  # ─────────────────────────── 编译 + 单测 + 冒烟 ───────────────────────────
  test:
    name: cargo test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sim

      - name: Build
        working-directory: sim
        run: cargo build --release --verbose

      - name: Test
        working-directory: sim
        run: cargo test --release -- --nocapture

      # 调试构建下的溢出检查：定点运算最容易在这里翻车
      - name: Test (debug, overflow checks on)
        working-directory: sim
        run: cargo test --verbose

      - name: 冒烟：世界自检 + 性能基线（结果仅记录，不作性能门禁）
        working-directory: sim
        run: |
          cargo run --release -q -p sim_cli -- worldcheck --world 64 2>&1 | tee /tmp/ci-smoke.log
          cargo run --release -q -p sim_cli -- bench --units 400 --ticks 20000 --rays 4 --world 256 --seed 1 2>&1 | tee -a /tmp/ci-smoke.log
          cargo run --release -q -p sim_cli -- nav --units 400 --ticks 2000 --world 256 --breach 500 --seed 1 2>&1 | tee -a /tmp/ci-smoke.log

      - name: 记录输出（失败时另存编译/测试日志）
        if: always()
        working-directory: sim
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          put_file() {  # $1 = 仓库内路径，$2 = 本地文件
            content=$(base64 < "$2" | tr -d '\n')
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/$1?ref=ci/artifacts" --jq .sha 2>/dev/null)
            if [ -n "$sha" ]; then
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$1" \
                -f message="ci: $1 (${GITHUB_SHA:0:8})" -f content="$content" \
                -f branch=ci/artifacts -f sha="$sha" > /dev/null
            else
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$1" \
                -f message="ci: $1 (${GITHUB_SHA:0:8})" -f content="$content" \
                -f branch=ci/artifacts > /dev/null
            fi
          }
          if [ "${{ job.status }}" != "success" ]; then
            {
              echo "commit: ${GITHUB_SHA}"
              echo "branch: ${GITHUB_REF_NAME}"
              echo "date: $(date -u)"
              echo "job status: ${{ job.status }}"
              echo
              echo "=== cargo build (short) ==="
              cargo build --release --message-format short 2>&1
              echo
              echo "=== cargo test (nocapture) ==="
              cargo test --release -- --nocapture 2>&1
            } > /tmp/ci-failure.log 2>&1
            put_file ci/last-failure.log /tmp/ci-failure.log
          fi
          [ -f /tmp/ci-smoke.log ] && put_file ci/perf/latest-smoke.log /tmp/ci-smoke.log
          exit 0

  # ─────────────────────────── 长基线（G1 取数）───────────────────────────
  bench:
    name: 性能基线（G1 取数，[bench] 或手动触发）
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.long_bench) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[bench]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sim
      - name: 五组负载
        working-directory: sim
        run: |
          set +e
          TICKS="${{ inputs.ticks || '100000' }}"
          {
            echo "commit: ${GITHUB_SHA}"
            echo "runner: $(uname -m) / $(grep -m1 'model name' /proc/cpuinfo | sed 's/.*: //')"
            echo "date: $(date -u)"
            echo "ticks: ${TICKS}"
            echo
            echo "=== A 最坏情况：400 单位 · 4 射线/tick · 128m 世界 · 不限长 ==="
            cargo run --release -q -p sim_cli -- bench --units 400 --ticks ${TICKS} --rays 4 --world 256 --seed 1
            echo
            echo "=== B 掩体评分（真实分布）：4 射线/tick · 截断到 30m ==="
            cargo run --release -q -p sim_cli -- bench --units 400 --ticks ${TICKS} --rays 4 --world 256 --maxdist 30000 --seed 1
            echo
            echo "=== C 感知 LOS（真实分布）：1 射线/tick · 截断到 80m ==="
            cargo run --release -q -p sim_cli -- bench --units 400 --ticks ${TICKS} --rays 1 --world 256 --maxdist 80000 --seed 1
            echo
            echo "=== D 压力：8 射线/tick · 不限长 ==="
            cargo run --release -q -p sim_cli -- bench --units 400 --ticks $(( ${TICKS} / 4 )) --rays 8 --world 256 --seed 1
            echo
            echo "=== E 单条成本：1 单位 · 不限长 ==="
            cargo run --release -q -p sim_cli -- bench --units 1 --ticks 200000 --rays 4 --world 256 --seed 1
          } > /tmp/ci-baseline.log 2>&1
          cat /tmp/ci-baseline.log
      - name: 记录基线
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          content=$(base64 < /tmp/ci-baseline.log | tr -d '\n')
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/ci/perf/latest-baseline.log?ref=ci/artifacts" --jq .sha 2>/dev/null)
          if [ -n "$sha" ]; then
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/ci/perf/latest-baseline.log" \
              -f message="ci: baseline ${GITHUB_SHA:0:8}" -f content="$content" \
              -f branch=ci/artifacts -f sha="$sha" > /dev/null
          else
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/ci/perf/latest-baseline.log" \
              -f message="ci: baseline ${GITHUB_SHA:0:8}" -f content="$content" \
              -f branch=ci/artifacts > /dev/null
          fi
          exit 0

  # ────────────────── 三平台确定性（A1 / A7 的必要条件）──────────────────
  determinism:
    name: 三平台确定性（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sim

      - name: Test (release)
        shell: bash
        working-directory: sim
        run: cargo test --release

      - name: 确定性负载（世界校验和 + bench）
        shell: bash
        working-directory: sim
        run: |
          set +e
          OS="${{ matrix.os }}"
          cargo run --release -q -p sim_cli -- worldcheck --world 64 > "worldcheck-${OS}.txt" 2>&1
          cargo run --release -q -p sim_cli -- bench --units 400 --ticks 20000 --rays 4 --world 256 --seed 1 > "bench-${OS}.txt" 2>&1
          {
            echo "os: ${OS}"
            echo "arch: $(uname -m)"
            echo "cpu: $( [ -f /proc/cpuinfo ] && grep -m1 'model name' /proc/cpuinfo | sed 's/.*: //' || sysctl -n machdep.cpu.brand_string 2>/dev/null || echo unknown )"
            echo "commit: ${GITHUB_SHA}"
            echo "date: $(date -u)"
          } > "meta-${OS}.txt"
          echo "--- worldcheck ---"; cat "worldcheck-${OS}.txt"
          echo "--- bench ---";      cat "bench-${OS}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: sim-${{ matrix.os }}
          path: sim/*-${{ matrix.os }}.txt
          if-no-files-found: error

  # A7 要求的"artifact 比对 job"：下载三平台产物，逐字节比对校验和
  determinism-compare:
    name: 三平台校验和比对（A1 / A7）
    needs: determinism
    if: always() && needs.determinism.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 列出产物
        run: ls -R artifacts
      - name: 逐平台校验和必须逐位一致
        run: |
          set -e
          fail=0
          for kind in worldcheck bench; do
            echo "=== ${kind} ==="
            base=""
            for f in artifacts/sim-*/${kind}-*.txt; do
              [ -f "$f" ] || continue
              os=$(basename "$f" .txt | sed "s/^${kind}-//")
              sum=$(grep -o '0x[0-9A-F]\{16\}' "$f" | tail -1)
              if [ -z "$sum" ]; then echo "  ${os}: 没找到校验和，视为失败"; fail=1; continue; fi
              echo "  ${os}: ${sum}"
              if [ -z "$base" ]; then base="$sum"; elif [ "$sum" != "$base" ]; then
                echo "  ❌ ${os} 与基线不一致（${sum} != ${base}）"; fail=1
              fi
            done
          done
          if [ "$fail" != "0" ]; then echo "::error::三平台校验和不一致"; exit 1; fi
          echo "✅ 三平台逐位一致"
      - name: 记录各平台输出
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          put_file() {
            content=$(base64 < "$2" | tr -d '\n')
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/$1?ref=ci/artifacts" --jq .sha 2>/dev/null)
            if [ -n "$sha" ]; then
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$1" \
                -f message="ci: $1 (${GITHUB_SHA:0:8})" -f content="$content" \
                -f branch=ci/artifacts -f sha="$sha" > /dev/null
            else
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$1" \
                -f message="ci: $1 (${GITHUB_SHA:0:8})" -f content="$content" \
                -f branch=ci/artifacts > /dev/null
            fi
          }
          for f in artifacts/sim-*/*.txt; do
            [ -f "$f" ] && put_file "ci/perf/$(basename "$f")" "$f"
          done
          exit 0

  # ─────────────────── Godot 薄绑定（A5：macOS arm64 也要能构建）──────────────────
  godot:
    name: Godot 薄绑定（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gdext

      - name: 构建 GDExtension
        working-directory: gdext
        run: cargo build --release

      - name: 下载 Godot 4.7.2（headless）
        shell: bash
        run: |
          set -e
          VER=4.7.2
          case "${{ matrix.os }}" in
            ubuntu-latest)
              ZIP="Godot_v${VER}-stable_linux.x86_64.zip"
              OUT="/tmp/godot/Godot_v${VER}-stable_linux.x86_64" ;;
            macos-15)
              ZIP="Godot_v${VER}-stable_macos.universal.zip"
              OUT="/tmp/godot/Godot.app/Contents/MacOS/Godot" ;;
          esac
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${VER}-stable/${ZIP}"
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "$OUT"
          echo "GODOT_BIN=$OUT" >> "$GITHUB_ENV"

      - name: 导入工程
        shell: bash
        run: |
          set -e
          "$GODOT_BIN" --headless --path godot --import 2>&1 | tee /tmp/godot-import.log

      - name: 冒烟：扩展能加载 + 能 tick + 校验和
        shell: bash
        run: |
          set -e
          "$GODOT_BIN" --headless --path godot --script res://scripts/smoke.gd 2>&1 | tee /tmp/godot-smoke.log

      - name: 记录输出
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          put_file() {
            [ -f "$2" ] || return 0
            content=$(base64 < "$2" | tr -d '\n')
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/$1?ref=ci/artifacts" --jq .sha 2>/dev/null)
            if [ -n "$sha" ]; then
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$1" \
                -f message="ci: $1 (${GITHUB_SHA:0:8})" -f content="$content" \
                -f branch=ci/artifacts -f sha="$sha" > /dev/null
            else
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$1" \
                -f message="ci: $1 (${GITHUB_SHA:0:8})" -f content="$content" \
                -f branch=ci/artifacts > /dev/null
            fi
          }
          put_file "ci/perf/godot-smoke-${{ matrix.os }}.log" /tmp/godot-smoke.log
          put_file "ci/perf/godot-import-${{ matrix.os }}.log" /tmp/godot-import.log
          exit 0

  # ─────────────────────────── 静态检查与参数 ───────────────────────────
  lint:
    name: 格式与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt（暂不阻塞，待首次修复后改为强制）
        working-directory: sim
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: clippy（暂不阻塞）
        working-directory: sim
        continue-on-error: true
        run: cargo clippy --all-targets

  constants:
    name: 参数与查找表一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 常量自检（派生量 / 分频 / 预算 / 导航 / 文档对照）
        run: python3 tools/check_constants.py --verbose
      - name: 查找表必须与生成器一致（防止手改生成物破坏跨平台确定性）
        run: python3 tools/gen_trig.py --check
      - name: sim 不得依赖 Godot（A6 边界强制）
        run: |
          if grep -rn "godot" --include="*.rs" --include="*.toml" sim/ ; then
            echo "::error::sim/ 里出现了 godot 依赖（边界被打破）"
            exit 1
          fi
          echo "✓ sim/ 与 Godot 无耦合"
