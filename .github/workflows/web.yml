name: Web 导出与部署

on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export:
    name: 导出 Web 并发布到 Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Godot 运行库
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libxss1

      - name: 下载 Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo install -m 755 "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: 下载并安装导出模板（约 1.3 GB）
        run: |
          curl -sSL -o templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          ls ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable | head

      - name: 导入资源
        run: godot --headless --path . --import

      - name: 导出 Web（单线程预设）
        run: |
          mkdir -p web_build
          set +e
          godot --headless --path . --export-release "Web" web_build/index.html 2>&1 | tee export.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit code = $code"
          ls -la web_build
          # 发成 annotation，避开被拦截的日志 CDN
          grep -nE "ERROR|error|Cannot|savepack|Wrote|export" export.log \
            | head -60 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          exit $code

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: web_build

      # enablement: Pages 被关掉时自动重新启用。之前整整几个里程碑就是卡在这里——
      # 页面 404，而 deploy 步骤被 continue-on-error 吞成"成功"，绿色的 run 假装一切正常。
      # permissions 里的 pages: write 就是给这个参数用的。
      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      # 故意不加 continue-on-error：部署失败就该是红的。
      # 产物（github-pages artifact）无论如何都会上传，失败时"部署结果提示"会给出兜底办法。
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 部署结果提示
        if: always()
        run: |
          outcome="${{ steps.deployment.outcome }}"
          echo "部署步骤结果：$outcome"
          if [ "$outcome" != "success" ]; then
            echo "::error::Pages 未发布（$outcome）。到 Settings → Pages → Build and deployment → Source 选 GitHub Actions，再重跑本 workflow。"
            echo "::warning::导出产物已上传为 artifact 'github-pages'，下载解压后用 python3 -m http.server 即可本地预览。"
          fi
