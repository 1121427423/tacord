name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  # 1) 不需要引擎：纯语法与风格检查
  lint:
    name: GDScript 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 gdtoolkit
        run: pip install gdtoolkit==4.5.0

      - name: 语法检查 (gdparse)
        run: |
          status=0
          for f in $(find scripts tests -name '*.gd' | sort); do
            if gdparse "$f"; then
              echo "  OK   $f"
            else
              echo "  FAIL $f"; status=1
            fi
          done
          exit $status

      - name: 风格检查 (gdlint)
        run: gdlint scripts tests

  # 2) 真正跑引擎：headless 执行 tests/smoke_test.tscn
  smoke-test:
    name: Headless 冒烟测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Godot 运行库
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libxss1

      - name: 下载 Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo install -m 755 "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: 导入资源
        run: godot --headless --path . --import

      - name: 运行冒烟测试
        run: |
          set +e
          godot --headless --path . tests/smoke_test.tscn 2>&1 | tee smoke.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit code = $code"
          # 把完整输出发成 workflow annotation（不依赖被拦截的日志 CDN）。
          nl -ba smoke.log | head -90 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit $code
